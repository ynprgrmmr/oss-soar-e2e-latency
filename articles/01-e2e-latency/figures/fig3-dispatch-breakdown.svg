<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t d"><title id="t">Dispatch breakdown, C1 vs C5</title><desc id="d">Stacked bars of the mean Wazuh-side and Shuffle-side parts of the dispatch segment for C1 and C5.</desc>
<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --grid:#e4e3df;
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --grid:#3a3a37;
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; }
  }
  .bg { fill: var(--surface); }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .t-title { font-size: 15px; font-weight: 600; }
  .t-sub, .t-axis, .t-tick { font-size: 11px; fill: var(--ink2); }
  .t-label { font-size: 12px; }
  .t-val { font-size: 11px; fill: var(--ink2); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--ink2); stroke-width: 1; }
  .guide { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; opacity: .6; }
</style>
<rect class="bg" x="0" y="0" width="880" height="320"/><text class="t-title" x="24" y="30">Inside the dispatch segment: only the Wazuh side gets faster under load</text><text class="t-sub" x="24" y="48">Mean ms per part, n = 30 each · from Shuffle backend/worker logs (ns) and Wazuh alert timestamps</text><rect x="24" y="64" width="12" height="12" rx="3" fill="var(--s1)"/><text class="t-label" x="42" y="74">Wazuh: alert → webhook</text><rect x="215.8" y="64" width="12" height="12" rx="3" fill="var(--s2)"/><text class="t-label" x="233.8" y="74">Shuffle: webhook → worker picks it up</text><rect x="511.1" y="64" width="12" height="12" rx="3" fill="var(--s3)"/><text class="t-label" x="529.1" y="74">Shuffle: worker → app → code starts</text><line class="grid" x1="150.0" y1="94" x2="150.0" y2="286"/><text class="t-tick" x="150.0" y="302" text-anchor="middle">0 s</text><line class="grid" x1="278.0" y1="94" x2="278.0" y2="286"/><text class="t-tick" x="278.0" y="302" text-anchor="middle">1 s</text><line class="grid" x1="406.0" y1="94" x2="406.0" y2="286"/><text class="t-tick" x="406.0" y="302" text-anchor="middle">2 s</text><line class="grid" x1="534.0" y1="94" x2="534.0" y2="286"/><text class="t-tick" x="534.0" y="302" text-anchor="middle">3 s</text><line class="grid" x1="662.0" y1="94" x2="662.0" y2="286"/><text class="t-tick" x="662.0" y="302" text-anchor="middle">4 s</text><line class="grid" x1="790.0" y1="94" x2="790.0" y2="286"/><text class="t-tick" x="790.0" y="302" text-anchor="middle">5 s</text><text class="t-label" x="138" y="141.0" text-anchor="end">C1 baseline</text><rect x="150.0" y="120" width="236.0" height="34" rx="0" fill="var(--s1)"><title>C1 · Wazuh: alert → webhook: 1,859 ms (mean, n=30)</title></rect><text class="t-val" x="269.0" y="114" text-anchor="middle">1,859</text><rect x="388.0" y="120" width="128.2" height="34" rx="0" fill="var(--s2)"><title>C1 · Shuffle: webhook → worker picks it up: 1,017 ms (mean, n=30)</title></rect><text class="t-val" x="453.1" y="114" text-anchor="middle">1,017</text><rect x="518.1" y="120" width="144.7" height="34" rx="4" fill="var(--s3)"><title>C1 · Shuffle: worker → app → code starts: 1,146 ms (mean, n=30)</title></rect><text class="t-val" x="591.5" y="114" text-anchor="middle">1,146</text><text class="t-val" x="672.8" y="141.0">= 4,022 ms</text><text class="t-label" x="138" y="221.0" text-anchor="end">C5 +20 alerts/s</text><rect x="150.0" y="200" width="155.0" height="34" rx="0" fill="var(--s1)"><title>C5 · Wazuh: alert → webhook: 1,227 ms (mean, n=30)</title></rect><text class="t-val" x="228.5" y="194" text-anchor="middle">1,227</text><rect x="307.0" y="200" width="119.4" height="34" rx="0" fill="var(--s2)"><title>C5 · Shuffle: webhook → worker picks it up: 949 ms (mean, n=30)</title></rect><text class="t-val" x="367.7" y="194" text-anchor="middle">949</text><rect x="428.4" y="200" width="140.6" height="34" rx="4" fill="var(--s3)"><title>C5 · Shuffle: worker → app → code starts: 1,114 ms (mean, n=30)</title></rect><text class="t-val" x="499.7" y="194" text-anchor="middle">1,114</text><text class="t-val" x="579.0" y="221.0">= 3,289 ms</text><line class="axis" x1="150" y1="286" x2="790" y2="286"/></svg>
